<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機車與商品專案快速篩選工具 (最新彙整版)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 600px; margin: auto; background-color: #f4f6f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; font-size: 22px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        select, input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; }
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
        .checkbox-label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 15px; }
        .checkbox-label.danger-label { color: #d93025; font-weight: bold; }
        .checkbox-label input { width: 18px; height: 18px; cursor: pointer; }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1557b0; }
        #result { margin-top: 20px; padding: 15px; border-radius: 6px; background-color: #fff; border: 1px solid #e0e0e0; }
        .result-item { padding: 10px 0; border-bottom: 1px dashed #eee; }
        .result-item:last-child { border-bottom: none; }
        .badge-bank { font-weight: bold; color: #1a73e8; font-size: 16px; }
        .badge-amount { font-weight: bold; color: #d93025; font-size: 16px; float: right; }
        .note { font-size: 13px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>專案快速比對工具</h2>

    <div class="form-group">
        <label>申辦類型</label>
        <select id="productType" onchange="toggleHoldingTime()">
            <option value="機車">機車貸款</option>
            <option value="商品">商品/手機貸款</option>
        </select>
    </div>

    <div class="form-group">
        <label>申請人年齡（歲）</label>
        <input type="number" id="age" value="25" min="18" max="80">
    </div>

    <div class="form-group" id="holdingGroup">
        <label>機車持有時間</label>
        <select id="holdingTime">
            <option value="0">未滿 3 個月</option>
            <option value="3-6">滿 3 個月 ~ 未滿 6 個月</option>
            <option value="6-12">滿 6 個月 ~ 1 年</option>
            <option value="12">1 年以上</option>
        </select>
    </div>

    <div class="form-group">
        <label>客戶條件與資歷（可多選）</label>
        <div class="checkbox-group">
            <label class="checkbox-label danger-label"><input type="checkbox" id="isNegotiation"> 為債務協商戶（21/亞太/合信婉拒）</label>
            <label class="checkbox-label"><input type="checkbox" id="isOffshore"> 現居/工作外島（麻吉/亞太/興達可承做）</label>
            <label class="checkbox-label danger-label"><input type="checkbox" id="hasFine30k"> 未繳罰單合計 3 萬(含)以上</label>
            <label class="checkbox-label"><input type="checkbox" id="hasGuarantor"> 有保人</label>
            <label class="checkbox-label"><input type="checkbox" id="hasCreditCard"> 持有信用卡（滿1年或檢附完整帳單）</label>
            <label class="checkbox-label"><input type="checkbox" id="hasLabor1Year"> 勞保滿 1 年</label>
            <label class="checkbox-label"><input type="checkbox" id="hasLaborHalfYear"> 勞保/現職滿半年（含以上）</label>
            <label class="checkbox-label"><input type="checkbox" id="hasLabor"> 有勞保/現職證明</label>
            <label class="checkbox-label"><input type="checkbox" id="hasPayHalfYear"> 名下分期/他牌繳息滿半年正常</label>
            <label class="checkbox-label"><input type="checkbox" id="hasOtherBike"> 名下已有另一台機車貸款中</label>
        </div>
    </div>

    <button onclick="evaluateLoan()">快速篩選可送方案</button>

    <div id="result">請選擇條件後點擊按鈕試算...</div>
</div>

<script>
function toggleHoldingTime() {
    const type = document.getElementById('productType').value;
    document.getElementById('holdingGroup').style.display = (type === "機車") ? "block" : "none";
}

function evaluateLoan() {
    const type = document.getElementById('productType').value;
    const age = parseInt(document.getElementById('age').value) || 0;
    const holdingMonths = document.getElementById('holdingTime').value;

    const isNegotiation = document.getElementById('isNegotiation').checked;
    const isOffshore = document.getElementById('isOffshore').checked;
    const hasFine30k = document.getElementById('hasFine30k').checked;
    const hasGuarantor = document.getElementById('hasGuarantor').checked;
    const hasCard = document.getElementById('hasCreditCard').checked;
    const labor1Y = document.getElementById('hasLabor1Year').checked;
    const labor6M = document.getElementById('hasLaborHalfYear').checked || labor1Y;
    const labor = document.getElementById('hasLabor').checked || labor6M;
    const pay6M = document.getElementById('hasPayHalfYear').checked;
    const otherBike = document.getElementById('hasOtherBike').checked;

    const resultDiv = document.getElementById('result');
    let results = [];

    const hasNothing = !hasCard && !labor && !pay6M && !hasGuarantor;

    if (type === "機車") {
        // --- 1. 麻吉PAY (機車) ---
        if (age >= 20 && age <= 70) {
            let ageNote = (age >= 55) ? " | 55歲需保人" : "";
            let negoNote = isNegotiation ? " | 協商戶可彈性試算" : "";
            
            results.push({ 
                bank: "麻吉PAY", 
                name: "機車專案", 
                amount: "5 ~ 10 萬", 
                note: `外島可做 | 雙證/存封/行照${ageNote}${negoNote} | 費用：內扣 15% + 對保費 6,000元` 
            });
        }

        // --- 2. 亞太 (機車) ---
        if (!isNegotiation && !hasFine30k && age >= 20 && age <= 50 && labor6M) {
            let amt = (holdingMonths === "12") ? (otherBike ? "16 萬" : "25 萬") : "16 ~ 25 萬";
            let bikeNote = otherBike ? "名下已有機車上限降為16萬" : "現職滿6個月";
            results.push({ 
                bank: "亞太", 
                name: "機車專案", 
                amount: amt, 
                note: `外島可做 | ${bikeNote} | 當面對保 | 費用：內扣 15% + 對保費 3,500元` 
            });
        }

        // --- 3. 21世紀 (機車 - 僅限本島) ---
        if (!isOffshore && !isNegotiation && !hasFine30k && age >= 20 && age <= 50 && holdingMonths !== "0" && labor6M) {
            results.push({ 
                bank: "21世紀", 
                name: "機車專案", 
                amount: "25 萬", 
                note: `自有機車持半年以上 | 現職滿半年 | 當面對保 | 費用：作業費 15% + 平台費 6% + 對保費 3,500元` 
            });
        }

        // --- 4. 合信 (機車原融 - 僅限本島) ---
        if (!isOffshore && !isNegotiation && age >= 20 && age <= 65 && holdingMonths !== "0") {
            if (hasGuarantor) {
                results.push({ bank: "合信", name: "機車保人專案", amount: "20 萬", note: "需附保人" });
            }
            if (hasCard) {
                results.push({ bank: "合信", name: "機車卡優專案", amount: "25 萬", note: "需持有信用卡" });
            }
            if (labor1Y) {
                results.push({ bank: "合信", name: "機車A專案", amount: "16 - 20 萬", note: "勞保/現職滿1年" });
            }
            if (holdingMonths === "3-6") {
                results.push({ bank: "合信", name: "機車原融專案", amount: "16 - 25 萬", note: "車持滿3個月~未滿6個月" });
            }
        }

    } else if (type === "商品") {
        // --- 1. 麻吉PAY (手機/商品) ---
        if (age >= 20 && age <= 55 && labor) {
            results.push({ 
                bank: "麻吉PAY", 
                name: "U質手機貸", 
                amount: "7 ~ 10 萬", 
                note: `外島可做 | 附勞保/薪轉/信用正常 | 費用：內扣 15% + 對保費 7,500元` 
            });
        }
        if (age >= 20 && age <= 70) {
            let ageNote = (age >= 55) ? " | 55歲需保人" : "";
            if (hasNothing) {
                results.push({ 
                    bank: "麻吉PAY", 
                    name: "手機貸 (小白/無財力)", 
                    amount: "3 ~ 6 萬", 
                    note: `外島可做 | 工作任職無特殊規定${ageNote} | 費用：內扣 15% + 對保費 7,500元` 
                });
            }
        }

        // --- 2. 興達 (興達貸) ---
        if (age >= 20 && age <= 55 && (pay6M || labor)) {
            let negoNote = isNegotiation ? " (協商兩年內不予承作/可拼補繳息)" : "";
            results.push({ 
                bank: "興達", 
                name: "興達貸", 
                amount: "6 ~ 10 萬", 
                note: `外島工作可做${negoNote} | 補信用卡近3期或繳息明細 | 派保面簽 | 費用：內扣 15% + 對保費 5,000元` 
            });
        }

        // --- 3. 亞太 (熊速貸) ---
        if (!isNegotiation && !hasFine30k && age >= 20 && age <= 50 && labor6M) {
            results.push({ 
                bank: "亞太", 
                name: "熊速貸", 
                amount: "12 萬", 
                note: `外島可做 | 現職滿6個月勞保 | 當面對保 | 費用：內扣 15% + 對保費 3,500元` 
            });
        }

        // --- 4. 21世紀 (商品貸A專案 - 僅限本島) ---
        if (!isOffshore && !isNegotiation && age >= 20 && age <= 55 && labor) {
            let ageNote = (age >= 55) ? " | 55歲需保人" : "";
            results.push({ 
                bank: "21世紀", 
                name: "商品貸A專案", 
                amount: "4 ~ 12 萬", 
                note: `正職/自營店面${ageNote} | 視訊對保 | 費用：內扣 15% + 對保費 6,000元` 
            });
        }

        // --- 5. 合信 (手機/小額 - 僅限本島) ---
        if (!isOffshore && !isNegotiation && age >= 20 && age <= 45) {
            if (hasCard) {
                results.push({ bank: "合信", name: "手機卡優專案", amount: "10 萬", note: "檢附信用卡近2個月帳單" });
            }
            if (labor) {
                results.push({ bank: "合信", name: "手機一般專案", amount: "7 萬", note: "檢附勞保或健保APP" });
            }
            if (pay6M) {
                results.push({ bank: "合信", name: "手機一般專案(繳息)", amount: "7 萬", note: "檢附名下分期6期完整繳息" });
            }
        }
    }

    // 渲染結果
    if (results.length > 0) {
        let html = "<b>最高可操作方案推薦：</b><br><br>";
        if (isOffshore) {
            html += "<div style='color:#1a73e8; font-size:13px; margin-bottom:10px;'>* 已篩選外島可承做機構（麻吉PAY、亞太、興達）</div>";
        }
        if (isNegotiation) {
            html += "<div style='color:#d93025; font-size:13px; margin-bottom:10px;'>* 已排除拒做協商戶之機構（21世紀、亞太、合信）</div>";
        }
        results.forEach(item => {
            html += `
                <div class="result-item">
                    <span class="badge-bank">【${item.bank}】${item.name}</span>
                    <span class="badge-amount">最高 ${item.amount}</span>
                    <div class="note">備註：${item.note}</div>
                </div>
            `;
        });
        resultDiv.innerHTML = html;
    } else {
        resultDiv.innerHTML = "<b style='color:orange;'>無匹配方案：</b>未滿足年齡、持有時間或因限制條件無可承做機構。";
    }
}
</script>

</body>
</html>
